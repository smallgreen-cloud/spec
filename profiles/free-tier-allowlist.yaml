# SmallGreen Spec — Cloudflare 免費層資源允許清單（機器可讀）
# Profile 判定腳本（SAP-2）讀本檔判定，不寫死在程式碼。
# 額度變動＝改本檔＋spec minor 版號；每筆額度需附 Evidence Pack 實測或官方文件日期。
# 版本：與 spec 同步（見 repo tag）
spec_version: "0.1.2"
verified_at: "2026-07-30"

allowed:
  workers:
    wrangler_keys: ["main"]
    free_quota: "100,000 requests/day"
    notes: "事件驅動，天然 scale-to-zero"
  static_assets:
    wrangler_keys: ["assets", "pages_build_output_dir"]
    free_quota: "unlimited requests (Pages/Static Assets)"
  d1:
    wrangler_keys: ["d1_databases"]
    free_quota: "5 GB total, 5M rows read/day"
  kv:
    wrangler_keys: ["kv_namespaces"]
    free_quota: "100k reads/day, 1k writes/day, 1 GB"
  r2:
    wrangler_keys: ["r2_buckets"]
    free_quota: "10 GB storage, Class A 1M/month"
  cron_triggers:
    wrangler_keys: ["triggers.crons"]
    free_quota: "available on free plan"
    notes: "cron 觸發不違反 scale-to-zero（閒置仍歸零）"
  workers_ai:
    wrangler_keys: ["ai"]
    free_quota: "10,000 Neurons/day（全模型共用 pool，00:00 UTC 重置）"
    notes: "使用本項者免費等級至多 C，額度緊者標 D（見 service-card SVC-4）"
  email_routing:
    wrangler_keys: ["send_email"]
    free_quota: "free"
    notes: "郵件類專案屬審慎區，Community Verified 需人工加驗濫用面"
  analytics_engine:
    wrangler_keys: ["analytics_engine_datasets"]
    free_quota: "100,000 data points written/day, 10,000 read queries/day（Workers Free）"
    notes: "2026-07-30 依官方 pricing 頁納入（S2 Sink 打標準時發現缺項）；官方標注目前未實際計費、未來數月開始，額度變動需複查。部署前需在 dashboard 一次性啟用（error 10089，無公開 API）"
  durable_objects_sqlite:
    wrangler_keys: ["durable_objects"]
    free_quota: "100,000 requests/day, 13,000 GB-s/day, SQL 5 GB total（Workers Free）"
    notes: "2026-07-30 依官方 pricing 頁納入（S2 UptimeFlare 打標準時發現排除項擋住首批專案）。條件式：僅限 SQLite-backed——migrations 只准 new_sqlite_classes，出現 new_classes（KV-backed，付費限定）即 fail"

excluded:
  queues:
    wrangler_keys: ["queues"]
    reason: "需 Workers Paid"
  durable_objects_kv_backed:
    wrangler_keys: ["migrations[].new_classes"]
    reason: "KV-backed DO 為付費限定；免費層限 SQLite-backed（見 allowed.durable_objects_sqlite）"
  hyperdrive:
    wrangler_keys: ["hyperdrive"]
    reason: "指向外部資料庫，違反 CF-only 原則"
  vectorize:
    wrangler_keys: ["vectorize"]
    reason: "免費層額度實測未完成；v0.2 評估"
  browser_rendering:
    wrangler_keys: ["browser"]
    reason: "免費層額度實測未完成；v0.2 評估"
